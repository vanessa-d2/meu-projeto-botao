<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem no WhatsApp</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container text-center mt-5">
        <h2>Exemplo de Botão com Mensagem</h2>
        <p>Clique no botão abaixo:</p>

        <button class="btn btn-primary btn-lg" onclick="mostrarMensagem()">
            Clique aqui
        </button>
    </div>

    <script>
        function mostrarMensagem() {
            alert("Olá! Esta é a mensagem que aparece ao clicar no botão 😄");
        }
    </script>

</body>
</html>
